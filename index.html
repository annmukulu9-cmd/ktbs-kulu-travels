<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KTBS — Kulu Travels Business System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="login" class="login-shell">
  <div class="login-card">
    <img class="login-logo" src="kulu-logo.png" alt="Kulu Travels">
    <div class="eyebrow">KULU TRAVELS</div>
    <h1>Business Management System</h1>
    <p>Clients · Journeys · Experiences</p>
    <form id="loginForm">
      <label>Email<input id="email" type="email" autocomplete="username" required></label>
      <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
      <button class="primary full">Sign in</button>
      <small id="loginMessage">Use your Supabase staff account.</small>
    </form>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="side-brand"><img src="kulu-logo.png" alt="Kulu"></div>
    <nav id="nav">
      <button data-page="dashboard" class="active">⌂ <span>Dashboard</span></button>
      <button data-page="clients">◎ <span>Client Master</span></button>
      <button data-page="quotations">▤ <span>Quotations</span></button>
      <button data-page="bookings">✈ <span>Bookings</span></button>
      <button data-page="suppliers">◇ <span>Suppliers</span></button>
      <button data-page="hotels">⌂ <span>Hotels</span></button>
      <button data-page="services">✦ <span>Services</span></button>
      <button data-page="finance">▰ <span>Finance</span></button>
      <button data-page="history">↺ <span>Travel History</span></button>
      <button data-page="reports">▥ <span>Reports</span></button>
      <button data-page="settings">⚙ <span>Settings</span></button>
    </nav>
    <div class="side-footer">KTBS v3.0<br>Kulu Travels · Supabase</div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div><div class="eyebrow">KULU TRAVELS</div><h2 id="pageTitle">Dashboard</h2></div>
      <div class="top-actions">
        <input id="globalSearch" placeholder="Search clients, bookings, quotations…">
        <span id="avatar" class="avatar">K</span><span id="userName">Staff</span>
        <span id="roleBadge" class="role-badge">STAFF</span>
        <button id="logout">Logout</button>
      </div>
    </header>
    <section id="content"></section>
  </main>
</div>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h3 id="modalTitle"></h3><button onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
